# /etc/nginx/sites-available/hramygaspry.ru  [TODO: домен]
# Сертификат: certbot --nginx -d hramygaspry.ru -d www.hramygaspry.ru

server {
    listen 80;
    listen [::]:80;
    server_name hramygaspry.ru www.hramygaspry.ru;
    return 301 https://hramygaspry.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hramygaspry.ru;
    ssl_certificate     /etc/letsencrypt/live/hramygaspry.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hramygaspry.ru/privkey.pem;
    return 301 https://hramygaspry.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hramygaspry.ru;

    ssl_certificate     /etc/letsencrypt/live/hramygaspry.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hramygaspry.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # массовая загрузка фото в альбом
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/calendar;

    # статика Next.js — кэшируется навсегда (в имени файла хеш)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ограничение частоты для форм и входа в админку
    location = /api/users/login {
        limit_req zone=hg_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# Добавьте в блок http { } файла /etc/nginx/nginx.conf:
