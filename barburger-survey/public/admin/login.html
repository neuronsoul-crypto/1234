<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Барбургер — Вход в админку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(155deg,#123a24 0%,#0b2a1c 55%,#081f15 100%);
}
.card{background:#faf3e2;border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.4);padding:40px 36px;width:100%;max-width:360px;text-align:center}
.title{font-family:'Anton',sans-serif;font-size:22px;text-transform:uppercase;color:#241408;letter-spacing:.5px;margin-bottom:4px}
.sub{font-size:13px;color:#7a6a56;margin-bottom:26px}
label{display:block;text-align:left;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#241408;margin-bottom:8px}
input[type=password]{width:100%;padding:13px 14px;border:1.5px solid #e6d8ba;border-radius:9px;font-size:15px;font-family:inherit;background:#fffaf0;color:#241408}
input[type=password]:focus{outline:none;border-color:#d79b3d}
button{width:100%;margin-top:20px;font-family:'Anton',sans-serif;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(180deg,#f0c26e,#d79b3d);color:#241408;border:none;padding:14px;border-radius:100px;font-size:15px;cursor:pointer;box-shadow:0 12px 26px rgba(215,155,61,.35);transition:.2s}
button:hover{transform:translateY(-1px)}
button:disabled{opacity:.6;cursor:default;transform:none}
.err{display:none;color:#a6273a;font-size:13px;margin-top:14px;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="title">Барбургер</div>
  <div class="sub">Админка · Результаты анкеты</div>
  <form id="loginForm">
    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Войти</button>
    <div class="err" id="loginErr">Неверный пароль. Попробуйте ещё раз.</div>
  </form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var btn = document.getElementById('loginBtn');
  var err = document.getElementById('loginErr');
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Входим...';
  fetch('/api/admin/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({password: document.getElementById('password').value})
  }).then(function(r){ return r.json().then(function(d){ return {status:r.status, data:d}; }); })
  .then(function(res){
    if(res.data.ok){
      window.location.href = 'dashboard.html';
    } else {
      err.textContent = res.data.error || 'Неверный пароль.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  }).catch(function(){
    err.textContent = 'Ошибка соединения с сервером.';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Войти';
  });
});
</script>
</body>
</html>
