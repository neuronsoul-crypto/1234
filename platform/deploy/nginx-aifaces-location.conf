# Отдельный сниппет — не редактируем существующий конфиг tavrida-osmotr.ru напрямую.
# Подключается одной строкой include изнутри уже существующего server-блока сайта.
# Проверить перед подключением: server_name в существующем vhost действительно tavrida-osmotr.ru,
# и порт 3050 не занят другим сервисом (см. DEPLOY.md шаг 1).

location /aifaces/ {
    proxy_pass         http://127.0.0.1:3050/aifaces/;
    proxy_http_version 1.1;
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Upgrade $http_upgrade;
    proxy_set_header    Connection "upgrade";
}
